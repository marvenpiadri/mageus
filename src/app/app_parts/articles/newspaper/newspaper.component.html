<div class="articleContainerScroll" [class.isClosing]="isClosing" role="dialog" aria-modal="true" aria-label="Article reader">
 
   
  <div class="articleContainerAlpha">
    <app-article [data]="post"></app-article>
  </div>

  <button type="button" class="closeWindow" aria-label="Close article and return to articles" (click)="closeArticle()">
    <i class="fas fa-times" aria-hidden="true"></i>
  </button>
</div>
